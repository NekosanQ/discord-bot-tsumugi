name: CI

on:
    push:
    pull_request:

permissions:
    contents: read

jobs:
    verify:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        services:
            redis:
                image: redis:8.2.8-alpine
                ports:
                    - 6379:6379
                options: >-
                    --health-cmd "redis-cli ping"
                    --health-interval 5s
                    --health-timeout 3s
                    --health-retries 5

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Generate Prisma Client
              run: npm run prisma:generate --workspace apps/api

            - name: Check monorepo unit tests
              run: npm run check

            - name: Run integration tests
              run: npm run test:integration --workspaces --if-present
              env:
                  API_REDIS_TEST_URL: redis://127.0.0.1:6379
                  BOT_REDIS_TEST_URL: redis://127.0.0.1:6379

            - name: Compile production output
              run: npm run compile
